description: TradeHero (operated by My Manisku Pte Ltd, Singapore) is a gamified virtual
  stock-trading and social-investing mobile app. Users start with 100,000 virtual dollars
  to practice trading risk-free across 28 stock exchanges and 10 currency pairs, follow
  and copy validated top traders, learn through a short-tutorial investing academy, and
  compete on cash-prize leaderboards backed by real-time market data. Founded by former
  Wall Street trading-platform and Electronic Arts mobile-gaming veterans, and backed by
  venture firms including 500 Global, KPCB China, and IPV Capital. The public surface is a
  consumer mobile app and marketing site; no developer API, SDK, or developer portal is
  published.
